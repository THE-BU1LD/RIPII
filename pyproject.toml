[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ripii"
version = "1.0.0"
description = "Renormalized Invariant Projective Inductive Intelligence"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["ripii", "ripii.models", "ripii.data", "ripii.utils"]

[tool.pytest.ini_options]
addopts = "-q"
