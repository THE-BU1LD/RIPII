name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q ripii scripts
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify portable retained-pilot summaries
        run: >-
          python scripts/verify_artifact.py
          --manifest research/results/pilot_v1/manifest.json
          --protocol research/protocols/pilot_v1.md
          --portable-summary
          && python scripts/verify_artifact.py
          --manifest research/results/pilot_v2/manifest.json
          --protocol research/protocols/pilot_v2.md
          --portable-summary
      - name: Verify retained world-model result capsule
        run: >-
          python -m ripii.world verify-capsule
          research/results/development/world_v3_convergence_capsule_v2.json
