name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install auditor
        run: python -m pip install --upgrade pip && python -m pip install pip-audit
      - name: Audit declared third-party dependency graph
        # Audit the local project definition instead of the installed RIPII
        # distribution. This preserves strict auditing of resolved third-party
        # dependencies without asking PyPI to resolve the local-only "ripii"
        # package itself.
        run: python -m pip_audit --strict .

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
