name: device-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  mps:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install exact lock
        run: uv sync --locked
      - name: Require MPS forward/backward repeatability
        run: uv run --no-sync python scripts/check_device_smoke.py --device mps

  cuda:
    if: ${{ vars.RIPII_CUDA_RUNNER == 'enabled' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install exact lock
        run: uv sync --locked
      - name: Require CUDA forward/backward repeatability
        run: uv run --no-sync python scripts/check_device_smoke.py --device cuda
